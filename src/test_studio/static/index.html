<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cross-platform Test Studio</title><link rel="stylesheet" href="/static/app.css"></head><body>
<header><div class="brand"><span class="brand-mark">TS</span><div><strong>Test Studio</strong><small>Portable Flow v1</small></div></div><div class="breadcrumbs"><span>自动化资产</span><b>/</b><strong id="flow-title-head">Flow</strong><span id="save-state" class="saved">已保存</span></div><div class="header-actions"><button class="button ghost" id="json-toggle">{ } JSON</button><button class="button ghost" id="save">保存</button><button class="button primary" id="run">▶ 运行</button></div></header>
<div class="layout">
 <aside class="rail"><button class="active" title="场景编排">⌘</button><button title="元素资产">◇</button><button title="执行历史">↻</button><button title="设置">⚙</button></aside>
 <aside class="catalog"><div class="catalog-head"><div><p>AUTOMATION FLOW</p><h2>场景编排</h2></div><button id="add-step" title="新增步骤">＋</button></div><div class="flow-summary"><label>场景名称<input id="flow-title"></label><div class="form-row"><label>运行平台<select id="flow-platform"><option value="any">跨平台</option><option value="desktop">Desktop</option><option value="android">Android</option><option value="ios">iOS</option></select></label><label>标签<input id="flow-tags" placeholder="smoke, regression"></label></div></div><div class="step-list" id="step-list"></div></aside>
 <main><div class="canvas-toolbar"><div><button title="撤销" id="undo">↶</button><button title="重做" id="redo">↷</button><span></span><button id="expand-all">展开全部</button><button id="collapse-all">收起全部</button></div><div class="flow-health" id="flow-health">Flow 结构有效</div></div><div class="canvas" id="canvas"></div></main>
 <aside class="inspector"><div id="inspector-empty" class="inspector-empty"><span>⌘</span><h3>选择一个步骤</h3><p>配置操作、定位策略和预期结果。</p></div><form id="inspector-form" class="hidden"><div class="inspector-head"><div><p>STEP SETTINGS</p><h2>步骤设置</h2></div><button type="button" id="delete-step" title="删除步骤">删除</button></div><label>步骤名称<input id="step-title"></label><label>操作类型<select id="step-action"><option>launch</option><option>tap</option><option>type</option><option>wait</option><option>swipe</option><option>back</option><option>screenshot</option><option>stop</option></select></label><div id="selector-fields"><div class="form-row"><label>定位方式<select id="selector-strategy"><option>test_id</option><option>accessibility</option><option>role</option><option>text</option><option>css</option><option>xpath</option><option>ocr</option><option>image</option></select></label><label>定位值<input id="selector-value"></label></div></div><label id="input-field">输入内容<input id="step-input"></label><label>超时时间（ms）<input id="step-timeout" type="number" min="1"></label><div class="assertion-head"><div><strong>预期结果</strong><small>一个操作可配置多个校验点</small></div><button type="button" id="add-assertion">＋ 添加</button></div><div id="assertions"></div></form></aside>
</div>
<dialog id="result-dialog"><div class="result-head"><div><p>EXECUTION RESULT</p><h2 id="result-title">执行结果</h2></div><button class="icon-button" data-close>×</button></div><div id="result-summary"></div><div id="result-steps"></div></dialog>
<dialog id="json-dialog"><div class="result-head"><div><p>PORTABLE FLOW V1</p><h2>JSON 源文件</h2></div><button class="icon-button" data-close>×</button></div><textarea id="json-source" spellcheck="false"></textarea><div class="dialog-actions"><button class="button ghost" data-close>取消</button><button class="button primary" id="apply-json">应用修改</button></div></dialog>
<div id="toast" class="toast hidden"></div><script src="/static/app.js" defer></script></body></html>
