[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-platform-test-studio"
version = "0.3.0"
description = "Portable flow model and deterministic cross-platform test runner"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "linyup"}]
dependencies = []

[project.optional-dependencies]
desktop = ["playwright>=1.45,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
test-studio = "test_studio.cli:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
test_studio = ["static/*"]
